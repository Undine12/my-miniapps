<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的小程序合集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      background: linear-gradient(150deg, #667eea 0%, #764ba2 50%, #db2777 100%);
      min-height: 100vh; padding: 40px 20px; color: #fff;
      display: flex; justify-content: center; align-items: center;
    }
    .wrap { width: 100%; max-width: 520px; text-align: center; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .sub { font-size: 14px; opacity: 0.85; margin-bottom: 36px; }
    .card {
      display: block; text-decoration: none; color: #1f2937;
      background: #fff; border-radius: 18px; padding: 24px;
      margin-bottom: 18px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: transform 0.15s;
    }
    .card:active { transform: scale(0.97); }
    .card .emoji { font-size: 34px; }
    .card h2 { font-size: 19px; margin: 10px 0 6px; }
    .card p { font-size: 14px; color: #6b7280; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎈 我的小程序合集</h1>
    <p class="sub">点下面任意一个，直接开始玩</p>

    <a class="card" href="bubble-sort/index.html">
      <div class="emoji">🫧</div>
      <h2>冒泡排序可视化</h2>
      <p>输入数字，动画演示冒泡排序的每一步比较与交换。</p>
    </a>

    <a class="card" href="personality-test/index.html">
      <div class="emoji">🧭</div>
      <h2>16 型人格快速测试</h2>
      <p>16 道题测出你的 MBTI 性格类型，快来看看你是哪一种。</p>
    </a>

    <a class="card" href="lianliankan/index.html">
      <div class="emoji">🍬</div>
      <h2>可爱连连看</h2>
      <p>找到相同图案，用不超过两个拐角连起来消除，看看你能多快清空！</p>
    </a>
  </div>
</body>
</html>
